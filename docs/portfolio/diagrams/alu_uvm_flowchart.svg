   <g id="text_24">
    <text style="font-style: italic; font-size: 7.5px; font-family: 'Liberation Sans', 'DejaVu Sans'; fill: #222222" transform="translate(14.4 675.924829)">Verilator 5.052 compiles the covergroup and records every bin's hits in coverage.dat, but cg.get_coverage() returns 0.00 % and ignore_bins is not applied; the functional coverage reported in this project is computed</text>
    <text style="font-style: italic; font-size: 7.5px; font-family: 'Liberation Sans', 'DejaVu Sans'; fill: #222222" transform="translate(14.4 684.695581)">from coverage.dat by scripts/cov_uvm.py. Verilator's constraint solver also rejects the dist-weighted randomize() of random_seq; ext/uvm_ext.sv supplies a procedural equivalent selected by a UVM factory override.</text>
   </g>
